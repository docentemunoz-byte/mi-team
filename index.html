const NOW=new Date();
const TODAY_KEY=dk(NOW);
const TODAY_DOW=NOW.getDay();
const TODAY_MON_OFF=TODAY_DOW===0?6:TODAY_DOW-1;

let members=JSON.parse(localStorage.getItem('mieq_members')||'["Ana García","Carlos López","María Ruiz","Pedro Soto","Laura Vega","Jorge Mora"]');
let data=JSON.parse(localStorage.getItem('mieq_data')||'{}');
let selMember=null,selKey=null,weekOff=0,selStatus=null,saveTimer=null;

function dk(d){return d.toISOString().slice(0,10);}
function isToday(d){return dk(d)===TODAY_KEY;}
function ini(n){return n.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();}
function tdiff(e,s){if(!e||!s)return 0;const[eh,em]=e.split(':').map(Number),[sh,sm]=s.split(':').map(Number);return Math.max(0,((sh*60+sm)-(eh*60+em))/60);}

function getWeek(off){
  const mon=new Date(NOW);
  mon.setDate(NOW.getDate()-TODAY_MON_OFF+off*7);
  return Array.from({length:7},(_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return d;});
}
function wLabel(){const w=getWeek(weekOff),f=d=>`${d.getDate()}/${d.getMonth()+1}`;return`${f(w[0])} – ${f(w[6])}`;}

function persist(){
  clearTimeout(saveTimer);
  setAutobar('saving');
  saveTimer=setTimeout(()=>{
    try{localStorage.setItem('mieq_data',JSON.stringify(data));setAutobar('ok');}
    catch(e){setAutobar('err');}
    setTimeout(()=>setAutobar('idle'),2500);
  },600);
}

function setAutobar(state){
  const bar=document.getElementById('autobar');
  if(!bar)return;
  const msgs={idle:'',saving:'Guardando...',ok:'Guardado automáticamente',err:'Error al guardar'};
  const icons={idle:'',saving:'⟳',ok:'✓',err:'⚠'};
  bar.className='autosave-bar as-'+state;
  bar.innerHTML=state==='idle'?'':`<span>${icons[state]}</span> ${msgs[state]}`;
}

function renderDateHeader(){
  const dayName=DFULL[TODAY_MON_OFF];
  const full=`${dayName}, ${NOW.getDate()} de ${MONTHS[NOW.getMonth()]} de ${NOW.getFullYear()}`;
  document.getElementById('navDate').textContent=full;
  document.getElementById('todayTxt').textContent=full;
  document.getElementById('rsmDate').textContent=wLabel();
}

function renderTeam(){
  const el=document.getElementById('teamRow');
  el.innerHTML=members.map((m,i)=>{
    const[bg,fg]=MCOLORS[i%MCOLORS.length].split(':');
    return`<div class="team-chip" data-m="${m}">
      <div class="t-avatar ${selMember===m?'active':''}" style="background:${bg};color:${fg}">${ini(m)}</div>
      <span class="t-name">${m.split(' ')[0]}</span>
    </div>`;
  }).join('');
  el.querySelectorAll('.team-chip').forEach(c=>c.addEventListener('click',()=>{
    selMember=c.dataset.m;selKey=null;
    document.getElementById('sheetArea').innerHTML='';
    renderTeam();renderGrid();
  }));
}

function renderGrid(){
  const weeks=getWeek(weekOff);
  const isCW=weekOff===0;
  document.getElementById('wCardLbl').textContent=wLabel();
  document.getElementById('daysHead').innerHTML=DAYS7.map((d,i)=>`<div class="wdh ${isCW&&i===TODAY_MON_OFF?'today-h':''}">${d}</div>`).join('');
  document.getElementById('daysGrid').innerHTML=weeks.map((date,i)=>{
    const key=`${selMember}|${dk(date)}`;
    const entry=data[key]||{};
    const est=entry.estado?ESTADOS[entry.estado]:null;
    const hasNote=entry.notas&&entry.notas.length;
    const pip=est?`<div class="status-pip" style="background:${est.dot}"></div>`:`<div style="height:9px"></div>`;
    const np=hasNote?`<div class="note-pip"></div>`:'';
    return`<div class="day-cell ${isToday(date)?'today-c':''} ${selKey===key?'selected-c':''}" data-key="${key}" data-date="${dk(date)}" data-di="${i}">
      <span class="day-num">${date.getDate()}</span>${pip}${np}
    </div>`;
  }).join('');
  document.getElementById('daysGrid').querySelectorAll('.day-cell').forEach(c=>c.addEventListener('click',()=>{
    if(!selMember)return;
    selKey=c.dataset.key;renderGrid();
    openSheet(c.dataset.key,c.dataset.date,parseInt(c.dataset.di));
  }));
}

function openSheet(key,date,di){
  if(!data[key])data[key]={notas:[]};
  selStatus=data[key].estado||null;
  const d=date.slice(8,10)+'/'+date.slice(5,7);
  const todayMark=date===TODAY_KEY?`<span class="today-pill">☀ Hoy</span>`:'';
  document.getElementById('sheetArea').innerHTML=`
    <div class="panel-sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <span class="sheet-title">${DFULL[di]} ${d}${todayMark}</span>
        <button class="sheet-close" id="closeSheet" aria-label="Cerrar">×</button>
      </div>
      <div class="seg-ctrl">
        <button class="seg-btn active" data-p="horarios">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          Horarios
        </button>
        <button class="seg-btn" data-p="notas">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          Notas
        </button>
      </div>
      <div class="pane active" id="pane-horarios">${buildHPane(key)}</div>
      <div class="pane" id="pane-notas">${buildNPane(key)}</div>
    </div>`;
  bindSheet(key);
  setTimeout(()=>document.getElementById('sheetArea').scrollIntoView({behavior:'smooth',block:'nearest'}),60);
}

function buildHPane(key){
  const e=data[key]||{};
  const showT=selStatus&&ESTADOS[selStatus]?ESTADOS[selStatus].showTime:true;
  const pills=Object.entries(ESTADOS).map(([k,v])=>`
    <div class="st-pill" data-s="${k}" style="background:${v.bg};color:${v.fg};border-color:${selStatus===k?v.dot:'transparent'}">
      <span class="st-dot" style="background:${v.dot}"></span>${v.label}
    </div>`).join('');
  return`<div class="ios-lbl">Estado del día</div>
    <div class="status-grid" id="statusGrid">${pills}</div>
    <div id="timeBlock" style="opacity:${showT?1:.35}">
      <div class="ios-lbl">Horario</div>
      <div class="time-row">
        <div class="time-field"><div class="time-lbl">Entrada</div><input type="time" id="hEnt" value="${e.entrada||'08:00'}" ${showT?'':'disabled'}></div>
        <div class="time-field"><div class="time-lbl">Salida</div><input type="time" id="hSal" value="${e.salida||'17:00'}" ${showT?'':'disabled'}></div>
      </div>
    </div>
    <div class="autosave-bar as-idle" id="autobar"></div>`;
}

function buildNPane(key){
  const notas=(data[key]&&data[key].notas)||[];
  const list=notas.length?notas.map((n,i)=>`<div class="note-chip"><span>${n.texto}</span><button class="note-del" data-ni="${i}" aria-label="Eliminar">×</button></div>`).join(''):'<div class="empty-note">Sin notas aún</div>';
  return`<div id="noteList">${list}</div>
    <textarea class="note-input" id="noteInput" placeholder="Escribe una nota..."></textarea>
    <button class="ios-btn-add" id="saveN">+ Agregar nota</button>`;
}

function bindSheet(key){
  document.getElementById('closeSheet').addEventListener('click',()=>{
    document.getElementById('sheetArea').innerHTML='';selKey=null;renderGrid();
  });
  document.querySelectorAll('.seg-btn').forEach(b=>b.addEventListener('click',function(){
    document.querySelectorAll('.seg-btn').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.pane').forEach(x=>x.classList.remove('active'));
    this.classList.add('active');
    document.getElementById('pane-'+this.dataset.p).classList.add('active');
  }));
  document.getElementById('statusGrid').querySelectorAll('.st-pill').forEach(p=>p.addEventListener('click',function(){
    selStatus=this.dataset.s;
    document.querySelectorAll('.st-pill').forEach(x=>{x.style.borderColor=x.dataset.s===selStatus?ESTADOS[x.dataset.s].dot:'transparent';});
    const showT=ESTADOS[selStatus].showTime;
    document.getElementById('timeBlock').style.opacity=showT?1:.35;
    document.getElementById('hEnt').disabled=!showT;
    document.getElementById('hSal').disabled=!showT;
    if(!data[key])data[key]={notas:[]};
    data[key].estado=selStatus;
    if(!showT){delete data[key].entrada;delete data[key].salida;}
    persist();renderGrid();
  }));
  function saveH(){
    if(!selStatus)return;
    if(!data[key])data[key]={notas:[]};
    data[key].estado=selStatus;
    if(ESTADOS[selStatus].showTime){
      data[key].entrada=document.getElementById('hEnt').value;
      data[key].salida=document.getElementById('hSal').value;
    }
    persist();renderGrid();
  }
  const hE=document.getElementById('hEnt'),hS=document.getElementById('hSal');
  if(hE)hE.addEventListener('change',saveH);
  if(hS)hS.addEventListener('change',saveH);
  document.getElementById('saveN').addEventListener('click',()=>{
    const txt=document.getElementById('noteInput').value.trim();
    if(!txt)return;
    if(!data[key])data[key]={notas:[]};
    if(!data[key].notas)data[key].notas=[];
    data[key].notas.push({texto:txt});
    persist();renderGrid();
    document.getElementById('noteInput').value='';
    refreshNoteList(key);
  });
  bindNoteDel(key);
}

function refreshNoteList(key){
  const notas=(data[key]&&data[key].notas)||[];
  document.getElementById('noteList').innerHTML=notas.length?notas.map((n,i)=>`<div class="note-chip"><span>${n.texto}</span><button class="note-del" data-ni="${i}" aria-label="Eliminar">×</button></div>`).join(''):'<div class="empty-note">Sin notas aún</div>';
  bindNoteDel(key);
}
function bindNoteDel(key){
  document.querySelectorAll('.note-del').forEach(b=>b.addEventListener('click',function(){
    data[key].notas.splice(parseInt(this.dataset.ni),1);
    persist();renderGrid();refreshNoteList(key);
  }));
}

function getMStats(m){
  const w=getWeek(weekOff);let p=0,a=0,t=0,nc=0,h=0,hpd=[];
  w.forEach((date)=>{
    const e=data[`${m}|${dk(date)}`]||{};
    if(e.estado==='presente'){p++;h+=tdiff(e.entrada,e.salida);}
    else if(e.estado==='ausente')a++;
    else if(e.estado==='tarde'){t++;h+=tdiff(e.entrada,e.salida);}
    else if(e.estado==='nocorresponde')nc++;
    hpd.push((e.estado==='presente'||e.estado==='tarde')?tdiff(e.entrada,e.salida):0);
  });
  return{p,a,t,nc,h:Math.round(h*10)/10,hpd};
}

function buildDonut(items,total){
  if(!items.length||!total)return`<svg width="80" height="80" viewBox="0 0 80 80"><circle cx="40" cy="40" r="28" fill="none" stroke="#3A3A3C" stroke-width="12"/></svg>`;
  const r=28,circ=2*Math.PI*r;let off=0;
  const sl=items.map(d=>{const pct=d.v/total,dash=pct*circ,gap=circ-dash,s=`<circle cx="40" cy="40" r="${r}" fill="none" stroke="${d.c}" stroke-width="12" stroke-dasharray="${dash.toFixed(1)} ${gap.toFixed(1)}" stroke-dashoffset="${(-(off/total)*circ+circ/4).toFixed(1)}" transform="rotate(-90 40 40)"/>`;off+=d.v;return s;}).join('');
  return`<svg width="80" height="80" viewBox="0 0 80 80" style="flex-shrink:0">${sl}</svg>`;
}

function renderRtInd(){
  const el=document.getElementById('rtp-ind');
  if(!selMember){el.innerHTML='<div class="no-member-msg">Selecciona un trabajador en Inicio</div>';return;}
  const s=getMStats(selMember);
  const weeks=getWeek(weekOff);
  const maxH=Math.max(...s.hpd,1);
  const di=[{v:s.p,c:'#34C759'},{v:s.t,c:'#FF9500'},{v:s.a,c:'#FF3B30'}].filter(d=>d.v>0);
  const total=s.p+s.a+s.t||1;
  el.innerHTML=`
    <div class="stat-2col">
      <div class="stat-box"><div class="stat-num" style="color:#34C759">${s.p}</div><div class="stat-lbl">Presentes</div></div>
      <div class="stat-box"><div class="stat-num" style="color:#007AFF">${s.h}</div><div class="stat-lbl">Horas</div></div>
      <div class="stat-box"><div class="stat-num" style="color:#FF3B30">${s.a}</div><div class="stat-lbl">Ausencias</div></div>
      <div class="stat-box"><div class="stat-num" style="color:#FF9500">${s.t}</div><div class="stat-lbl">Tardanzas</div></div>
    </div>
    <div class="seg-label">Asistencia</div>
    <div class="donut-row">${buildDonut(di,total)}<div style="flex:1">${[{l:'Presente',c:'#34C759',v:s.p},{l:'Tarde',c:'#FF9500',v:s.t},{l:'Ausente',c:'#FF3B30',v:s.a}].filter(d=>d.v>0).map(d=>`<div class="dl-item"><div class="dl-dot" style="background:${d.c}"></div>${d.l}<span class="dl-val">${d.v}</span></div>`).join('')}</div></div>
    <div class="seg-label">Horas por día</div>
    ${s.hpd.map((h,i)=>{const isT=isToday(weeks[i]);return`<div class="bar-row"><span class="bar-day" style="color:${isT?'#007AFF':'var(--text3)'}">${DAYS7[i]}</span><div class="bar-track"><div class="bar-fill ${isT?'bar-today-fill':''}" style="width:${Math.round(h/maxH*100)}%"></div></div><span class="bar-val">${h>0?h.toFixed(1)+'h':'–'}</span></div>`;}).join('')}`;
}

function renderRtEquipo(){
  const el=document.getElementById('rtp-equipo');
  const tots=members.reduce((a,m)=>{const s=getMStats(m);a.p+=s.p;a.a+=s.a;a.t+=s.t;a.h+=s.h;return a;},{p:0,a:0,t:0,h:0});
  tots.h=Math.round(tots.h*10)/10;
  const maxH=Math.max(...members.map(m=>getMStats(m).h),1);
  const dEq=[{v:tots.p,c:'#34C759'},{v:tots.t,c:'#FF9500'},{v:tots.a,c:'#FF3B30'}].filter(d=>d.v>0);
  const tD=tots.p+tots.a+tots.t||1;
  el.innerHTML=`
    <div class="stat-2col">
      <div class="stat-box"><div class="stat-num" style="color:#34C759">${tots.p}</div><div class="stat-lbl">Total presentes</div></div>
      <div class="stat-box"><div class="stat-num" style="color:#007AFF">${tots.h}</div><div class="stat-lbl">Horas totales</div></div>
      <div class="stat-box"><div class="stat-num" style="color:#FF3B30">${tots.a}</div><div class="stat-lbl">Total ausencias</div></div>
      <div class="stat-box"><div class="stat-num" style="color:#FF9500">${tots.t}</div><div class="stat-lbl">Total tardanzas</div></div>
    </div>
    <div class="seg-label">Equipo esta semana</div>
    <div class="donut-row">${buildDonut(dEq,tD)}<div style="flex:1">${[{l:'Presente',c:'#34C759',v:tots.p},{l:'Tarde',c:'#FF9500',v:tots.t},{l:'Ausente',c:'#FF3B30',v:tots.a}].filter(d=>d.v>0).map(d=>`<div class="dl-item"><div class="dl-dot" style="background:${d.c}"></div>${d.l}<span class="dl-val">${d.v}</span></div>`).join('')}</div></div>
    <div class="seg-label">Horas por persona</div>
    ${members.map((m,i)=>{
      const s=getMStats(m);const[bg,fg]=MCOLORS[i%MCOLORS.length].split(':');
      return`<div class="m-row"><div class="m-av" style="background:${bg};color:${fg}">${ini(m)}</div><div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:600;color:var(--text);margin-bottom:4px">${m.split(' ')[0]}</div><div class="bar-track"><div class="bar-fill" style="width:${Math.round(s.h/maxH*100)}%"></div></div></div><div>${s.p?`<span class="m-badge" style="background:#E8F8EC;color:#27500A">${s.p}P</span>`:''}${s.t?`<span class="m-badge" style="background:#FFF4E5;color:#633806">${s.t}T</span>`:''}${s.a?`<span class="m-badge" style="background:#FFF0EF;color:#791F1F">${s.a}A</span>`:''}</div></div>`;
    }).join('')}`;
}

document.querySelectorAll('.tb-item').forEach(t=>t.addEventListener('click',function(){
  document.querySelectorAll('.tb-item').forEach(x=>x.classList.remove('active'));
  this.classList.add('active');
  const v=this.dataset.v;
  document.getElementById('view-inicio').style.display=v==='inicio'?'flex':'none';
  document.getElementById('view-resumen').style.display=v==='resumen'?'flex':'none';
  document.getElementById('view-equipo').style.display=v==='equipo'?'flex':'none';
  if(v==='resumen'){renderRtInd();renderRtEquipo();document.getElementById('rsmDate').textContent=wLabel();}
  if(v==='equipo') renderEqList();
}));

document.querySelectorAll('.rsm-tab').forEach(t=>t.addEventListener('click',function(){
  document.querySelectorAll('.rsm-tab').forEach(x=>x.classList.remove('active'));
  this.classList.add('active');
  document.querySelectorAll('.rsm-pane').forEach(x=>x.classList.remove('active'));
  document.getElementById('rtp-'+this.dataset.rt).classList.add('active');
}));

document.getElementById('prevW').addEventListener('click',()=>{weekOff--;renderGrid();});
document.getElementById('nextW').addEventListener('click',()=>{weekOff++;renderGrid();});

renderDateHeader();
renderTeam();
renderGrid();

function renderEqList(){
  const el=document.getElementById('eqList');
  el.innerHTML=members.map((m,i)=>{
    const[bg,fg]=MCOLORS[i%MCOLORS.length].split(':');
    return`<div class="eq-row">
      <div class="t-avatar" style="background:${bg};color:${fg};width:36px;height:36px;font-size:12px;border:none">${ini(m||'?')}</div>
      <input class="eq-input" value="${m}" data-i="${i}" placeholder="Nombre del trabajador">
      <button class="eq-del" data-i="${i}" aria-label="Eliminar">×</button>
    </div>`;
  }).join('');
  el.querySelectorAll('.eq-input').forEach(inp=>inp.addEventListener('input',function(){
    members[parseInt(this.dataset.i)]=this.value;
  }));
  el.querySelectorAll('.eq-del').forEach(b=>b.addEventListener('click',function(){
    members.splice(parseInt(this.dataset.i),1);
    localStorage.setItem('mieq_members',JSON.stringify(members));
    renderEqList();renderTeam();
  }));
}

document.getElementById('eqAdd').addEventListener('click',()=>{
  members.push('Nuevo trabajador');
  renderEqList();
  const inputs=document.querySelectorAll('.eq-input');
  const last=inputs[inputs.length-1];
  last.focus();last.select();
});

document.getElementById('eqSave').addEventListener('click',()=>{
  document.querySelectorAll('.eq-input').forEach((inp,i)=>{members[i]=inp.value.trim()||'Sin nombre';});
  localStorage.setItem('mieq_members',JSON.stringify(members));
  renderTeam();renderGrid();
  const n=document.getElementById('eqNote');
  n.style.color='#34C759';
  n.textContent='✓ Equipo actualizado correctamente';
  setTimeout(()=>n.textContent='',2500);
});

function buildEmailResumen(){
  const w=getWeek(weekOff);
  const f=d=>`${d.getDate()}/${d.getMonth()+1}`;
  const semana=`${f(w[0])} – ${f(w[6])}`;
  let body=`RESUMEN SEMANAL DEL EQUIPO\nSemana: ${semana}\n\n`;
  members.forEach(m=>{
    const s=getMStats(m);
    body+=`👤 ${m}\n`;
    body+=`   Presentes: ${s.p} | Tardanzas: ${s.t} | Ausencias: ${s.a} | Horas: ${s.h}h\n`;
    w.forEach((date,i)=>{
      const e=data[`${m}|${dk(date)}`]||{};
      if(e.estado){
        const est=ESTADOS[e.estado];
        const hora=e.entrada?` (${e.entrada}–${e.salida})`:'';
        body+=`   ${DFULL[i]}: ${est.label}${hora}\n`;
        if(e.notas&&e.notas.length) e.notas.forEach(n=>body+=`     📝 ${n.texto}\n`);
      }
    });
    body+='\n';
  });
  const tots=members.reduce((a,m)=>{const s=getMStats(m);a.p+=s.p;a.a+=s.a;a.t+=s.t;a.h+=s.h;return a;},{p:0,a:0,t:0,h:0});
  tots.h=Math.round(tots.h*10)/10;
  body+=`TOTALES DEL EQUIPO\nPresentes: ${tots.p} | Tardanzas: ${tots.t} | Ausencias: ${tots.a} | Horas totales: ${tots.h}h`;
  return{subject:`Resumen equipo semana ${semana}`,body};
}

document.getElementById('emailBtn').addEventListener('click',()=>{
  const{subject,body}=buildEmailResumen();
  window.location.href=`mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
});

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
